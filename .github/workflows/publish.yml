name: Publish to npm

on:
  push:
    tags: [v*]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Debug OIDC env
        run: |
          echo "NODE_AUTH_TOKEN=[${NODE_AUTH_TOKEN:-unset}]"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN=[${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-unset}]"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=[${ACTIONS_ID_TOKEN_REQUEST_URL:-unset}]"
          echo "npm version: $(npm --version)"
          cat .npmrc 2>/dev/null || echo "no .npmrc"
          cat ~/.npmrc 2>/dev/null || echo "no ~/.npmrc"
      - run: npm publish --access public
